# Streamlit app config (applies both locally and on Streamlit Community Cloud)

[server]
# Disable file watching: the hot-reload watcher would recursively scan imported
# unrelated dependencies (e.g. transformers), flooding startup logs with noise.
# Side effect: code edits no longer auto-refresh — click Rerun (top right) manually.
fileWatcherType = "none"

[theme]
base = "light"
